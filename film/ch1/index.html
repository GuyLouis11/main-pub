  tl.fromTo('#f04hold', { scale: 1 }, { scale: 1.06, transformOrigin: '1296px 638px', duration: Math.max(1, E('question') - qt(7.9)), ease: 'sine.inOut', immediateRender: false }, qt(7.9));
  // red pen goes over his "?" as "look closer" arrives; the dot becomes the lens; iris closes on it
  FILM.draw('#qtrace', Math.max(qt(7.95), P('C1_08', .45)), .7, 'power1.inOut');
  const LZ = Math.max(qt(8.2), P('C1_08', .72));
  FILM.pop('#lens', LZ, .35);
  tl.set('#iris', { opacity: 1, clipPath: 'circle(150% at 1296px 638px)' }, E('question') - 1.1);
  tl.to('#iris', { clipPath: 'circle(0% at 1296px 638px)', duration: 1.0, ease: 'power3.in' }, E('question') - 1.1);
  tl.set('#iris', { clipPath: 'circle(150% at 1296px 638px)' }, 0);

  FILM.finish('ch1');
})();
