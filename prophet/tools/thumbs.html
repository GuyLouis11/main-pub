  .stroke { -webkit-text-stroke: 3px rgba(0,0,0,.35); paint-order: stroke fill; }

<!-- C: one of 10,240 -->
<div class="t" id="C">
  <div class="bgx" style="background:radial-gradient(ellipse 70% 80% at 50% 50%,#121b36 0%,#060914 60%,#020307 100%)"></div>
  <canvas id="cv" width="1280" height="720" style="position:absolute;left:0;top:0"></canvas>
  <div class="huge stroke" style="position:absolute;left:0;width:1280px;text-align:center;top:500px;font-size:150px;color:#fff;text-shadow:0 10px 0 #000,0 0 30px rgba(0,0,0,.8)">1 OF <span style="color:#ffb347">10,240</span></div>
</div>
<script>
const id = new URLSearchParams(location.search).get('t') || 'A';
document.getElementById(id).classList.add('on');
if (id === 'C') {
  const cx = document.getElementById('cv').getContext('2d');
  let s = 7; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let y = 0; y < 52; y++) for (let x = 0; x < 100; x++) {
    const px = 40 + x * 12.2, py = 30 + y * 12.2, d = Math.hypot(px - 640, py - 300);
    const alive = r() < (d < 120 ? .25 : .06);
    cx.fillStyle = alive ? 'rgba(232,238,252,.85)' : 'rgba(255,59,79,.18)'; cx.fillRect(px, py, 8, 8);
  }
  cx.fillStyle = '#ffb347'; cx.shadowColor = '#ffb347'; cx.shadowBlur = 30; cx.fillRect(626, 286, 28, 28);
  cx.shadowBlur = 0; cx.strokeStyle = '#ffb347'; cx.lineWidth = 5; cx.strokeRect(612, 272, 56, 56);
}
</script>
</body></html>
